# Configurando a conex\u00e3o com MongoDB enquanto reposit\u00f3rio de dados
# replicaSet=rs0: necessário para transações (consistência entre pedidos e auditoria)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/?replicaSet=rs0}
spring.data.mongodb.database=pizzaria

# Senhas iniciais dos usuários padrão: definidas SOMENTE por variáveis de ambiente.
# Sem a variável, o usuário correspondente não é criado (nenhuma senha fica no código).
app.senha-inicial.admin=${SENHA_ADMIN:}
app.senha-inicial.gerente=${SENHA_GERENTE:}
app.senha-inicial.atendente=${SENHA_ATENDENTE:}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.atrah=DEBUG
# Gera pedidos de demonstração para o dashboard (desative com false em produção)
app.dados-demo=true