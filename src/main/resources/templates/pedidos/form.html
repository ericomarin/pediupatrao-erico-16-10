<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Novo Pedido</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a href="/pedidos" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0">Novo Pedido</h2>
    </div>

    <!-- Mensagem de erro -->
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm" style="max-width: 720px;">
        <div class="card-body p-4">
            <form th:action="@{/pedidos/salvar}" method="post">

                <!-- Cliente -->
                <div class="mb-4">
                    <label for="clienteId" class="form-label fw-medium">
                        <i class="bi bi-person me-1"></i>Cliente
                    </label>
                    <select id="clienteId" name="clienteId" class="form-select" required>
                        <option value="" disabled selected>Selecione o cliente</option>
                        <option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.nome}"></option>
                    </select>
                </div>

                <!-- Itens -->
                <label class="form-label fw-medium"><i class="bi bi-basket me-1"></i>Itens</label>
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Preço</th>
                            <th style="width: 120px;">Quantidade</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="produto, stat : ${produtos}">
                            <td th:text="${produto.nome}"></td>
                            <td th:text="${'R$ ' + #numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}"></td>
                            <td>
                                <input type="hidden" th:name="|itens[${stat.index}].produtoId|" th:value="${produto.id}">
                                <input type="number" class="form-control form-control-sm"
                                       th:name="|itens[${stat.index}].quantidade|" value="0" min="0">
                            </td>
                        </tr>
                    </tbody>
                </table>

                <p class="small text-muted">O valor total é calculado pelo sistema com base nos preços cadastrados.</p>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>Registrar Pedido
                    </button>
                    <a href="/pedidos" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

</div>

</body>
</html>
